<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Windows PowerShell</title>
  <style>
    body {
      background-color: #0c0c0c;
      color: #cccccc;
      font-family: "Consolas", "Courier New", monospace;
      padding: 15px;
      margin: 0;
      box-sizing: border-box;
    }
    #terminal {
      white-space: pre-wrap;
      word-break: break-all;
    }
    .input-line {
      display: flex;
      align-items: center;
      margin-top: 5px;
    }
    .prompt {
      color: #cccccc;
      white-space: nowrap;
      margin-right: 8px;
    }
    input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 1rem;
      flex: 1;
      outline: none;
    }
    .error {
      color: #ff5555;
    }
  </style>
</head>
<body>

<div id="terminal">Windows PowerShell
Copyright (C) Microsoft Corporation. All rights reserved.

請輸入 help 查看可用指令。

</div>

<div class="input-line">
  <span class="prompt">PS C:\Welcome&gt;</span>
  <input type="text" id="cmdInput" autofocus autocomplete="off">
</div>

<script>
  const terminal = document.getElementById('terminal');
  const cmdInput = document.getElementById('cmdInput');

  // 指令庫內容
  const helpText = `AVAILABLE COMMANDS:
> binary    : 將 0 與 1 轉換成文字
> ascii     : 查看 ASCII 對照提示
> notice    : 大都會飯店 即時資訊網
> clear     : 清除螢幕畫面`;

  const binaryText = `【Binary 解碼提示】
請將 8 個一組的 0 與 1 轉為 10 進位數字，再對照 ASCII 碼。
範例：01000001 = 65 = 'A'`;

  const asciiText = `【ASCII 對照表簡記】
大寫字母 A-Z : 65 - 90
小寫字母 a-z : 97 - 122`;

  const noticeText = `====================================================
大都會飯店 公告網
====================================================
【公告】近日有房客反映天花板傳出不明噪音。
經管家派員調查，發現異音來源位於「中山醫學大學 誠愛樓 1F 電梯佈告欄」下方。
目前正在徵召勇闖飯店的冒險者前往調查處理，不便之處敬請見諒。
====================================================`;

  cmdInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const inputVal = cmdInput.value.trim().toLowerCase();
      
      // 印出使用者輸入的指令
      printText(`PS C:\\Welcome> ${cmdInput.value}`);

      if (inputVal === 'help') {
        printText(helpText + '\n');
      } else if (inputVal === 'binary') {
        printText(binaryText + '\n');
      } else if (inputVal === 'ascii') {
        printText(asciiText + '\n');
      } else if (inputVal === 'notice') {
        printText(noticeText + '\n');
      } else if (inputVal === 'clear') {
        terminal.innerHTML = `Windows PowerShell\nCopyright (C) Microsoft Corporation. All rights reserved.\n\n請輸入 help 查看可用指令。\n\n`;
      } else if (inputVal !== '') {
        printText(`'${cmdInput.value}' error。請輸入 help 查看可用指令。\n`, 'error');
      }

      cmdInput.value = '';
      window.scrollTo(0, document.body.scrollHeight);
    }
  });

  function printText(text, className = '') {
    const div = document.createElement('div');
    div.textContent = text;
    if (className) div.classList.add(className);
    terminal.appendChild(div);
  }
</script>

</body>
</html>
